
{% extends "base.html" %}

{% block style %}{% endblock %}

{% block content %}

<div class="card">
    <div class="calendar-nav">
        <div class="d-flex text-muted ms-4">
            Monthly P&L: <p id="monthlyPnl" class="m-0 ms-3 month-pnl">0</p>
        </div>

        <button class="nav-btn btn-none ms-auto me-3" onclick="changeMonth(-1)"><i class="fa-solid fa-less-than"></i></button>
        <div class="current-month" id="currentMonth"></div>
        <button class="nav-btn btn-none ms-3" onclick="changeMonth(1)"><i class="fa-solid fa-greater-than"></i></button>
        
        <a href="{{ url_for('journal_pages.add_trade') }}" class="btn btn-pill bg-primary ms-auto">
            <i class="fas fa-plus me-2"></i>Add Trade
        </a>
        <a href="#" class="btn btn-pill bg-primary ms-2" onclick="showImportModal()">
            <i class="fas fa-upload me-2"></i>Import Trades
        </a>
    </div>

    <div class="card-body calendar">
        <div class="calendar-headers" id="calendarHeaders">
            <!-- Calendar will be generated here -->
        </div>
        <div class="calendar-grid" id="calendarGrid">
            <!-- Calendar will be generated here -->
        </div>
    </div>
</div>

<!-- Modal -->
<div id="tradesModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Trades del día</h2>
            <span class="close" onclick="closeModal('tradesModal')"><i class="fa-solid fa-xmark"></i></span>
        </div>
        <div class="modal-body">
            <!-- Gráfico de evolución del capital -->
            <div class="chart-container">
                <div class="chart-title">Evolución del Capital Durante la Sesión</div>
                <div class="chart-wrapper">
                    <canvas id="capitalChart"></canvas>
                </div>
            </div>

            <div class="summary mt-4" id="daySummary">
                <!-- Summary will be generated here -->
            </div>
            <div id="tradesList">
                <!-- Trades list will be generated here -->
            </div>
        </div>
    </div>
</div>
<!-- Modal -->
<div id="importModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Import Trades</h2>
            <span class="close" onclick="closeModal('importModal')"><i class="fa-solid fa-xmark"></i></span>
        </div>
        <div class="modal-body">
            <form id="importForm" class="mt-2 ms-4 me-4">
                <div class="col col-md-8">
                    <div class="row"><input type="file" name="file" id="csvFile" accept=".csv" required></div>
                    <div class="row mt-3">
                        <label>
                            <input type="checkbox" id="dryRun" name="dry_run">
                            Do not save in DB
                        </label>
                    </div>
                </div>
                <div class="col col-md-4">
                    <label class="form-label">Timezone</label>
                    <input type="text" id="transaction_timezone" name="transaction_timezone" class="form-control" value="US/Eastern">
                </div>
                <div class="col">
                    <div class="text-center">
                        <button type="submit" class="btn btn-pill btn-primary mt-4">Import</button>
                    </div>
                </div>
            </form>

            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="text-center d-none">
                <div class="loading-spinner">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">In progress...</span>
                    </div>
                    <p class="mt-3">Uploading trades...</p>
                </div>
            </div>

            <div id="importResults" class="mt-4"></div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
    <script>
        let tradingData = {};
        let capitalChart = null;
        let currentDate = new Date();
        const monthNames = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];
        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        function getLocalDateString(date=null) {
            if (!date) {
                date = currentDate;
            }
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function getData() {
            // Usa la fecha actual del calendario
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1; // JS: 0-indexed, Python: 1-indexed
            const day = 1;
            const dateStr = getLocalDateString(currentDate);

            try {
                const response = await fetch(`{{ url_for('journal_endpoints.month_trades', date=0) }}`.replace('0', dateStr));
                if (!response.ok) throw new Error('Error fetching trades');
                const trades = await response.json();

                // Organiza los trades por fecha (usa exit_date o la propiedad que corresponda)
                tradingData = {};
                trades.forEach(trade => {
                    // TODO: Usar el exit date es lo correcto?
                    const dateKey = trade.exit_date;
                    if (!tradingData[dateKey]) tradingData[dateKey] = [];
                    tradingData[dateKey].push({
                        id: trade.id,
                        symbol: trade.symbol,
                        type: trade.trade_type,
                        entry: trade.entry_price,
                        exit: trade.exit_price,
                        quantity: trade.quantity,
                        pnl: trade.profit_loss,
                        equity: trade.equity,
                        time: trade.exit_time
                    });
                });
                generateCalendar();
            } catch (error) {
                console.error(error);
                tradingData = {};
            }
        }
    
        function generateCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('currentMonth').textContent = 
                `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - firstDay.getDay());

            const calendarGrid = document.getElementById('calendarGrid');
            calendarGrid.innerHTML = '';
            const calendarHEaders = document.getElementById('calendarHeaders');
            calendarHEaders.innerHTML = '';

            // Add day headers
            dayNames.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';
                dayHeader.textContent = day;
                calendarHEaders.appendChild(dayHeader);
            });

            // Generate calendar days
            const today = new Date();
            let monthPnl = 0;
            for (let i = 0; i < 42; i++) {
                const cellDate = new Date(startDate);
                cellDate.setDate(startDate.getDate() + i);
                
                const dayCell = document.createElement('div');
                dayCell.className = 'day-cell';
                
                if (cellDate.getMonth() !== month) {
                    dayCell.classList.add('other-month');
                }

                if (cellDate.toDateString() === today.toDateString()) {
                    dayCell.classList.add('today');
                }

                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = zeroPad(cellDate.getDate(), 2);
                dayCell.appendChild(dayNumber);

                // Add profit/loss data
                const dateKey = getLocalDateString(cellDate);
                const dayTrades = tradingData[dateKey] || [];
                if (dayTrades.length > 0) {
                    const totalPnL = dayTrades.reduce((sum, trade) => sum + trade.pnl, 0);
                    monthPnl += totalPnL;
                    const pnlElement = document.createElement('div');
                    // pnlElement.className = 'profit-loss';
                    
                    if (totalPnL > 0) {
                        pnlElement.classList.add('profit');
                        pnlElement.textContent = `${formatNumber(totalPnL.toFixed(2), 'currency', 1, 2, 'compact')}`;
                    } else if (totalPnL < 0) {
                        pnlElement.classList.add('loss');
                        pnlElement.textContent = `${formatNumber(Math.abs(totalPnL).toFixed(2), 'currency', 1, 2, 'compact') }`;
                    } else {
                        pnlElement.classList.add('breakeven');
                        pnlElement.textContent = '$0.00';
                    }
                    const tradesElement = document.createElement('div');
                    tradesElement.className = 'text-muted';
                    tradesElement.textContent += `${dayTrades.length} trades`;
                    
                    dayCell.appendChild(pnlElement);
                    dayCell.appendChild(tradesElement);
                    dayCell.onclick = () => showTradesModal(cellDate, dayTrades);
                }
                console.log(dayCell);
                calendarGrid.appendChild(dayCell);
            }

            monthPnlElement = document.getElementById('monthlyPnl');
            if (monthPnl > 0) {
                monthPnlElement.classList.add('text-profit');
                monthPnlElement.textContent = `${formatNumber(monthPnl.toFixed(2), 'currency', 1, 2, 'compact') }`;
            } else if (monthPnl < 0) {
                monthPnlElement.classList.add('text-loss');
                monthPnlElement.textContent = `${formatNumber(Math.abs(monthPnl).toFixed(2), 'currency', 1, 2, 'compact') }`;
            } else {
                monthPnlElement.classList.add('text-breakeven');
                monthPnlElement.textContent = '$0.00';
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            getData();
        }

        function createCapitalChart (trades) {
            const ctx = document.getElementById('capitalChart').getContext('2d');

            // Destruir gráfico anterior si existe
            if (capitalChart) {
                capitalChart.destroy();
            }

            // Procesar datos para crear la curva de evolución del capital
            console.log('Trades: ', trades);
            const chartData = processCapitalEvolution(trades);
            console.log('Chart data: ', chartData);

            // Encontrar valores mínimo y máximo para crear gradientes dinámicos
            const minValue = Math.min(...chartData.values);
            const maxValue = Math.max(...chartData.values);
            const hasNegativeValues = minValue < 0;
            const hasPositiveValues = maxValue > 0;

            // Crear gradiente dinámico basado en el rango de valores
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);

            if (hasNegativeValues && hasPositiveValues) {
                // Si hay valores positivos y negativos, crear gradiente que cambie en el cero
                const zeroPosition = Math.abs(minValue) / (maxValue - minValue);

                gradient.addColorStop(0, 'rgba(34, 197, 94, 0.4)'); // Verde arriba (positivo)
                gradient.addColorStop(Math.max(zeroPosition - 0.05, 0), 'rgba(34, 197, 94, 0.1)');
                gradient.addColorStop(zeroPosition, 'rgba(128, 128, 128, 0.1)'); // Gris en el cero
                gradient.addColorStop(Math.min(zeroPosition + 0.05, 1), 'rgba(239, 68, 68, 0.1)');
                gradient.addColorStop(1, 'rgba(239, 68, 68, 0.4)'); // Rojo abajo (negativo)
            } else if (hasPositiveValues) {
                // Solo valores positivos
                gradient.addColorStop(0, 'rgba(34, 197, 94, 0.4)');
                gradient.addColorStop(1, 'rgba(34, 197, 94, 0.05)');
            } else {
                // Solo valores negativos
                gradient.addColorStop(0, 'rgba(239, 68, 68, 0.05)');
                gradient.addColorStop(1, 'rgba(239, 68, 68, 0.4)');
            }

            // Crear dataset principal con todos los datos
            const mainDataset = {
                label: 'Capital Evolution',
                data: chartData.values,
                borderColor: function (ctx) {
                    const value = ctx.parsed?.y ?? chartData.values[ctx.dataIndex];
                    if (value > 0) return '#22c55e';
                    if (value < 0) return '#ef4444';
                    return '#6b7280'; // Gris para cero
                },
                backgroundColor: function (context) {
                    const chart = context.chart;
                    const { ctx, chartArea, scales } = chart;

                    if (!chartArea) {
                        // Layout of the chart is not ready yet (first render)
                        return 'rgba(0, 0, 0, 0)';
                    }

                    const top = chartArea.top;
                    const bottom = chartArea.bottom;
                    const yAxis = scales.y;
                    const zeroY = yAxis.getPixelForValue(0);

                    const gradient = ctx.createLinearGradient(0, top, 0, bottom);

                    if (yAxis.min < 0 && yAxis.max > 0) {
                        const zeroPos = bottom - top != 0 ? (zeroY - top) / (bottom - top) : 0;

                        gradient.addColorStop(0, 'rgba(34, 197, 94, 0.4)');
                        gradient.addColorStop(Math.max(zeroPos - 0.02, 0), 'rgba(34, 197, 94, 0.05)');
                        gradient.addColorStop(zeroPos, 'rgba(128, 128, 128, 0.1)');
                        gradient.addColorStop(Math.min(zeroPos + 0.02, 1), 'rgba(239, 68, 68, 0.05)');
                        gradient.addColorStop(1, 'rgba(239, 68, 68, 0.4)');
                    } else if (yAxis.max <= 0) {
                        gradient.addColorStop(0, 'rgba(239, 68, 68, 0.05)');
                        gradient.addColorStop(1, 'rgba(239, 68, 68, 0.4)');
                    } else {
                        gradient.addColorStop(0, 'rgba(34, 197, 94, 0.4)');
                        gradient.addColorStop(1, 'rgba(34, 197, 94, 0.05)');
                    }

                    return gradient;
                },
                borderWidth: 3,
                fill: 'origin', // Fill to the y-axis (zero line)
                tension: 0.4,
                pointRadius: function (ctx) {
                    const value = ctx.parsed?.y ?? chartData.values[ctx.dataIndex];
                    return value === 0 ? 4 : 0; // Show points only at zero values
                },
                pointBackgroundColor: function (ctx) {
                    const value = ctx.parsed?.y ?? chartData.values[ctx.dataIndex];
                    if (value > 0) return '#22c55e';
                    if (value < 0) return '#ef4444';
                    return '#6b7280';
                },
                pointBorderColor: '#fff',
                pointBorderWidth: 2,
                pointHoverRadius: 6,
                spanGaps: true, // Connect all points
                segment: {
                    borderColor: function (ctx) {
                        const currentValue = ctx.p1.parsed.y;
                        const previousValue = ctx.p0.parsed.y;

                        // Color of the segment based on the current value
                        if (currentValue > 0) return '#22c55e';
                        if (currentValue < 0) return '#ef4444';
                        return '#6b7280';
                    }
                }
            };

            capitalChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: [mainDataset]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(0,0,0,0.8)',
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            borderWidth: 1,
                            callbacks: {
                                label: function (context) {
                                    const value = context.parsed.y;
                                    let color = '#6b7280';
                                    let prefix = '';

                                    if (value > 0) {
                                        color = '#22c55e';
                                        prefix = '+';
                                    } else if (value < 0) {
                                        color = '#ef4444';
                                        prefix = '';
                                    }

                                    return `Capital: ${prefix}$${value.toFixed(2)}`;
                                },
                                labelColor: function (context) {
                                    const value = context.parsed.y;
                                    let color = '#6b7280';

                                    if (value > 0) color = '#22c55e';
                                    else if (value < 0) color = '#ef4444';

                                    return {
                                        borderColor: color,
                                        backgroundColor: color
                                    };
                                }
                            }
                        },
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                maxTicksLimit: 8,
                                color: '#666'
                            }
                        },
                        y: {
                            grid: {
                                color: function (ctx) {
                                    // Línea más marcada en el cero
                                    return ctx.tick.value === 0 ? 'rgba(107, 114, 128, 0.5)' : 'rgba(0,0,0,0.1)';
                                },
                                lineWidth: function (ctx) {
                                    return ctx.tick.value === 0 ? 2 : 1;
                                }
                            },
                            ticks: {
                                color: function (ctx) {
                                    // Color diferente para el tick del cero
                                    return ctx.tick.value === 0 ? '#374151' : '#666';
                                },
                                callback: function (value) {
                                    const prefix = value > 0 ? '+' : '';
                                    return `${prefix}$${value.toFixed(0)}`;
                                }
                            }
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    elements: {
                        point: {
                            radius: 0
                        }
                    }
                }
            });
        }

        function processCapitalEvolutionOld (trades) {
            const allBalancePoints = [];

            // Recopilar todos los puntos de balance de todos los trades
            trades.forEach(trade => {
                if (trade.equity && Array.isArray(trade.equity)) {
                    trade.equity.forEach(point => {
                        allBalancePoints.push({
                            ...point,
                            datetime: new Date(point.datetime),
                            tradeId: trade.id // Añadir ID del trade para referencia
                        });
                    });
                }
            });

            console.log('All points: ', allBalancePoints);

            if (allBalancePoints.length === 0) {
                return { labels: ['Sin datos'], values: [0] };
            }

            // Ordenar todos los puntos por tiempo
            allBalancePoints.sort((a, b) => a.datetime - b.datetime);

            // Crear una línea temporal continua
            const labels = ['Inicio'];
            const values = [0];

            // Mantener el balance acumulado total
            let totalAccumulatedCapital = 0;

            // Mantener el último balance conocido de cada trade
            const lastBalancePerTrade = new Map();

            // Procesar cada punto en orden cronológico
            allBalancePoints.forEach(point => {
                // Actualizar el último balance conocido para este trade
                lastBalancePerTrade.set(point.tradeId, point.balance);

                // Calcular el balance total sumando los últimos balances de todos los trades activos
                let currentTotalBalance = 0;
                for (const balance of lastBalancePerTrade.values()) {
                    currentTotalBalance += balance;
                }

                labels.push(point.time);
                values.push(currentTotalBalance);
            });

            // Alternativa más simple si cada trade es independiente y secuencial:
            // En este caso, simplemente acumulas el PnL final de cada trade
            /*
            const simpleLabels = ['Inicio'];
            const simpleValues = [0];
            let cumulativePnL = 0;
            
            trades.forEach((trade, index) => {
                if (trade.equity && trade.equity.length > 0) {
                    // Tomar el último punto del trade (PnL final del trade)
                    const finalPoint = trade.equity[trade.equity.length - 1];
                    cumulativePnL += finalPoint.total_pnl || 0;
                    
                    simpleLabels.push(`Trade ${index + 1}`);
                    simpleValues.push(cumulativePnL);
                }
            });
            
            return { labels: simpleLabels, values: simpleValues };
            */

            // Limitar el número de puntos para mejor visualización
            if (labels.length > 100) {
                const step = Math.ceil(labels.length / 100);
                const filteredLabels = labels.filter((_, index) => index % step === 0);
                const filteredValues = values.filter((_, index) => index % step === 0);

                // Asegurar que incluimos el último punto
                if (filteredLabels[filteredLabels.length - 1] !== labels[labels.length - 1]) {
                    filteredLabels.push(labels[labels.length - 1]);
                    filteredValues.push(values[values.length - 1]);
                }

                return { labels: filteredLabels, values: filteredValues };
            }

            return { labels, values };
        }

        function processCapitalEvolution (trades, initialCapital = 0) {
            const points = [];

            trades.forEach(trade => {
                if (!trade.equity) return;

                trade.equity.forEach(e => {
                    points.push({
                        datetime: new Date(e.datetime),
                        pnl: e.total_pnl,
                        tradeId: trade.id
                    });
                });
            });

            if (points.length === 0)
                return { labels: ["Sin datos"], values: [initialCapital] };

            // Ordenar por tiempo
            points.sort((a, b) => a.datetime - b.datetime);

            // Último PnL conocido por trade
            const lastPnl = new Map();

            const labels = [];
            const values = [];

            for (const p of points) {
                lastPnl.set(p.tradeId, p.pnl);

                let totalPnl = 0;
                for (const v of lastPnl.values())
                    totalPnl += v;

                labels.push(p.datetime.toISOString());
                values.push(initialCapital + totalPnl);
            }

            return { labels, values };
        }

        function showTradesModal(date, trades) {
            const modal = document.getElementById('tradesModal');
            const modalTitle = document.getElementById('modalTitle');
            const daySummary = document.getElementById('daySummary');
            const tradesList = document.getElementById('tradesList');

            modalTitle.textContent = `Trades from ${date.getDate()} of ${monthNames[date.getMonth()]} ${date.getFullYear()}`;

            // Create the capital evolution chart
            createCapitalChart(trades);

            // Generate summary
            const totalPnL = trades.reduce((sum, trade) => sum + trade.pnl, 0);
            const winningTrades = trades.filter(trade => trade.pnl > 0).length;
            const losingTrades = trades.filter(trade => trade.pnl < 0).length;

            daySummary.innerHTML = `
                <div class="summary-item">
                    <div class="summary-label">Total P&L</div>
                    <div class="summary-value ${totalPnL > 0 ? 'text-profit' : totalPnL < 0 ? 'text-loss' : 'text-breakeven'}">
                        ${totalPnL >= 0 ? '+' : ''}$${totalPnL.toFixed(2)}
                    </div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Winning Trades</div>
                    <div class="summary-value text-profit">${winningTrades}</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Losing Trades</div>
                    <div class="summary-value text-loss">${losingTrades}</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Total Trades</div>
                    <div class="summary-value">${trades.length}</div>
                </div>
            `;

            // Generate trades list
            if (trades.length === 0) {
                tradesList.innerHTML = '<div class="no-trades">There are no trades for this day</div>';
            } else {
                tradesList.innerHTML = trades.map(trade => `
                    <div class="card card-body trade-item d-flex flex-row align-items-center shadow-none" onclick="goToTradeDetails(${trade.id})">
                        <div class="trade-info">
                            <div class="trade-symbol">${trade.symbol} - ${trade.type}</div>
                            <div class="trade-details">
                                ${trade.time} | Entry: $${trade.entry} → Exit: $${trade.exit} | Quantity: ${trade.quantity}
                            </div>
                        </div>
                        <div class="trade-pnl ${trade.pnl > 0 ? 'text-profit' : trade.pnl < 0 ? 'text-loss' : 'text-breakeven'}">
                            ${trade.pnl >= 0 ? '+' : ''}$${trade.pnl.toFixed(2)}
                        </div>
                        <div class="trade-actions" onclick="event.stopPropagation()">
                            <button class="btn btn-pill bg-primary" onclick="editTrade(${trade.id})">Edit</button>
                            <button class="btn btn-pill bg-danger" onclick="deleteTrade(${trade.id})">Delete</button>
                        </div>
                    </div>
                `).join('');
            }

            modal.style.display = 'block';
        }

        function showImportModal () {
            const modal = document.getElementById('importModal');
            modal.style.display = 'block';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';

            // Limpiar el gráfico al cerrar
            if (id == 'tradesModal' && capitalChart) {
                capitalChart.destroy();
                capitalChart = null;
            }
        }

        function goToTradeDetails(tradeId) {
            // Simulate navigation to trade details page
            // alert(`Navegando a los detalles del trade ID: ${tradeId}`);
            window.location.href = `{{ url_for('journal_pages.get_trade', id=0) }}`.replace('0', tradeId);
        }

        function editTrade(tradeId) {
            // alert(`Editando trade ID: ${tradeId}`);
            window.location.href = `{{ url_for('journal_pages.edit_trade', trade_id=0) }}`.replace('0', tradeId);
        }
        
        async function deleteTrade(tradeId) {
            if (confirm('¿Estás seguro de que quieres borrar este trade?')) {
                const url = `{{ url_for('journal_pages.delete_trade', trade_id=0) }}`.replace('0', tradeId);
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest',
                            'Content-Type': 'application/x-www-form-urlencoded'
                        }
                    });
                    if (response.redirected) {
                        window.location.href = response.url;
                    } else {
                        // Si no hay redirección, recarga la página
                        window.location.reload();
                    }
                } catch (error) {
                    alert('Error al borrar el trade');
                }
            }
        }

        async function importFile() {
            const form = document.getElementById('importForm');
            const file = form.querySelector('#csvFile').files[0];
            const dryRun = form.querySelector('#dryRun').checked;
            const timezone = form.querySelector('#transaction_timezone').value;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('dry_run', dryRun);
            formData.append('transaction_timezone', timezone);
            try {
                const spinner = document.querySelector('#importModal #loadingSpinner');
                spinner.classList.remove('d-none');
                spinner.querySelector('.loading-spinner').style.display = 'block';
                const response = await fetch("{{ url_for('journal_endpoints.import_trades') }}", {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                const resultsDiv = document.getElementById('importResults');

                if (result.success) {
                    resultsDiv.innerHTML = `
                        <h3>✓ Successful import</h3>
                        <ul>
                            <li>Executions: ${result.stats.total_executions}</li>
                            <li>Trades: ${result.stats.trades_created}</li>
                            <li>Closed: ${result.stats.closed_trades}</li>
                            <li>Open: ${result.stats.open_trades}</li>
                        </ul>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <h3>✗ Error in import</h3>
                        <ul>
                            ${result.stats.errors.map(e => `<li>${e}</li>`).join('')}
                        </ul>
                    `;
                }
                spinner.classList.add('d-none');
                spinner.querySelector('.loading-spinner').style.display = 'none';
            } catch (error) {
                alert('Error: ' + error.message);
                spinner.classList.add('d-none');
                spinner.querySelector('.loading-spinner').style.display = 'none';
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modals = ['tradesModal', 'importModal'];
            for (const modalId of modals) {
                let modal = document.getElementById(modalId);
                if (event.target === modal) {
                    closeModal(modalId);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Initialize calendar
            getData();

            document.getElementById('importForm').addEventListener('submit', function(event) {
                event.preventDefault();
                importFile();
            });
        });

    </script>
{% endblock %}
